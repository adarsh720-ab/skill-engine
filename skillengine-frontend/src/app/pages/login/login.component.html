<div class="auth-shell">
  <div class="card auth-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to explore the skill graph.</p>
    
    <div class="banner-success" *ngIf="registered()">Account created — please sign in.</div>
    <div class="banner-error" *ngIf="errorMessage()">{{ errorMessage() }}</div>

    <div class="banner-error" *ngIf="errorMessage()">{{ errorMessage() }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
        <span class="error" *ngIf="form.controls.email.touched && form.controls.email.invalid">
          Enter a valid email address.
        </span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
        <span class="error" *ngIf="form.controls.password.touched && form.controls.password.invalid">
          Password is required.
        </span>
      </div>

      <button type="submit" class="btn btn-primary full" [disabled]="loading()">
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="switch">
      New here? <a routerLink="/register">Create an account</a>
    </p>
  </div>
</div>
