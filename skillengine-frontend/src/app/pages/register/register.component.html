<div class="auth-shell">
  <div class="card auth-card">
    <h1>Create your account</h1>
    <p class="subtitle">Start mapping skill paths across careers.</p>

    <div class="banner-error" *ngIf="errorMessage()">{{ errorMessage() }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
        <span class="error" *ngIf="form.controls.email.touched && form.controls.email.invalid">
          Enter a valid email address.
        </span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" autocomplete="new-password" placeholder="At least 8 characters" />
        <span class="error" *ngIf="form.controls.password.touched && form.controls.password.invalid">
          Password must be at least 8 characters.
        </span>
      </div>

      <button type="submit" class="btn btn-primary full" [disabled]="loading()">
        {{ loading() ? 'Creating account…' : 'Create account' }}
      </button>
    </form>

    <p class="switch">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
